app-id: dev.llastudio.lemon-watch
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: lemon-watch
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: lemon-watch
    buildsystem: simple
    build-commands:
      - install -Dm755 lemon-watch /app/bin/lemon-watch
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/dev.llastudio.lemon-watch.png
      - install -Dm644 dev.llastudio.lemon-watch.desktop /app/share/applications/dev.llastudio.lemon-watch.desktop
    sources:
      # Prebuilt binary and metadata are staged locally by the release workflow,
      # so flatpak-builder never needs network access to fetch sources.
      - type: file
        path: lemon-watch
      - type: file
        path: icon.png
      - type: file
        path: dev.llastudio.lemon-watch.desktop
