name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  APP_NAME: lemon-watch

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cargo_bin: lemon-watch.exe
            out_bin: lemon-watch.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            cargo_bin: lemon-watch
            out_bin: lemon-watch-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            cargo_bin: lemon-watch
            out_bin: lemon-watch-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cargo_bin: lemon-watch
            out_bin: lemon-watch-linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CFLAGS: "-Wno-error -Wno-deprecated-declarations"
        run: cargo build --release --target ${{ matrix.target }}
        timeout-minutes: 45

      - name: Prepare artifact directory
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/${{ matrix.cargo_bin }}" "out/${{ matrix.out_bin }}"
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            chmod +x "out/${{ matrix.out_bin }}"
          fi
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: builds-${{ matrix.os }}-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  package-windows:
    needs: [build]
    if: always() && needs.build.result != 'cancelled'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: builds-windows-latest-x86_64-pc-windows-msvc
          path: builds

      - name: Package portable .exe
        run: |
          mkdir -p release
          cp builds/lemon-watch.exe "release/${{ env.APP_NAME }}-win-x64.exe"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  package-macos:
    needs: [build]
    if: always() && needs.build.result != 'cancelled'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: builds-macos-latest-*
          merge-multiple: true
          path: builds

      - name: Create .app.zip and .dmg
        run: |
          set -e
          mkdir -p out release

          if [ -f builds/lemon-watch-aarch64 ] && [ -f builds/lemon-watch-x86_64 ]; then
            lipo -create -output out/lemon-watch-mac \
              builds/lemon-watch-aarch64 builds/lemon-watch-x86_64
          elif [ -f builds/lemon-watch-aarch64 ]; then
            cp builds/lemon-watch-aarch64 out/lemon-watch-mac
          elif [ -f builds/lemon-watch-x86_64 ]; then
            cp builds/lemon-watch-x86_64 out/lemon-watch-mac
          else
            echo "No macOS binary found"
            exit 1
          fi

          mkdir -p "release/LemonWatch.app/Contents/MacOS"
          mkdir -p "release/LemonWatch.app/Contents/Resources"
          cp out/lemon-watch-mac "release/LemonWatch.app/Contents/MacOS/LemonWatch"
          chmod +x "release/LemonWatch.app/Contents/MacOS/LemonWatch"

          cat > "release/LemonWatch.app/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>LemonWatch</string>
            <key>CFBundleIconFile</key><string>icon.icns</string>
            <key>CFBundleIdentifier</key><string>dev.llastudio.lemon-watch</string>
            <key>CFBundleName</key><string>LemonWatch</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>CFBundleVersion</key><string>1.0.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          if [ -f assets/icon.icns ]; then
            cp assets/icon.icns "release/LemonWatch.app/Contents/Resources/icon.icns"
          fi

          (
            cd release
            zip -r "lemon-watch-mac-universal.app.zip" "LemonWatch.app"
            mkdir -p dmg-root
            cp -R "LemonWatch.app" dmg-root/
            ln -s /Applications dmg-root/Applications
            hdiutil create -volname "LemonWatch" \
              -srcfolder dmg-root \
              -ov -format UDZO "lemon-watch-mac-universal.dmg"
            rm -rf "LemonWatch.app" dmg-root
          )
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release/*
          if-no-files-found: error

  package-linux:
    needs: [build]
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: builds-ubuntu-latest-x86_64-unknown-linux-gnu
          path: builds

      - name: Install AppImage and Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder libfuse2t64 || sudo apt-get install -y flatpak flatpak-builder libfuse2
          wget -q https://github.com -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
        shell: bash

      - name: Package AppImage
        run: |
          set -e
          mkdir -p release AppDir/usr/bin
          cp builds/lemon-watch-linux AppDir/usr/bin/lemon-watch
          chmod +x AppDir/usr/bin/lemon-watch

          cat > AppDir/lemon-watch.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=LemonWatch
          Exec=lemon-watch
          Icon=lemon-watch
          Categories=Utility;
          EOF

          if [ -f assets/icon.png ]; then
            cp assets/icon.png AppDir/lemon-watch.png
          else
            python3 -c "import struct,zlib; sig=b'\x89PNG\r\n\x1a\n'; chunk=lambda t,d: struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff); ihdr=struct.pack('>IIBBBBB',64,64,8,2,0,0,0); idat=zlib.compress(b'\x00'*64*193); open('AppDir/lemon-watch.png','wb').write(sig+chunk(b'IHDR',ihdr)+chunk(b'IDAT',idat)+chunk(b'IEND',b''))"
          fi

          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/lemon-watch" "$@"
          EOF
          chmod +x AppDir/AppRun

          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run AppDir "release/lemon-watch-linux-x86_64.AppImage"
        shell: bash

      - name: Package Flatpak
        run: |
          set -e
          mkdir -p flatpak-repo release
          flatpak remote-add --user --if-not-exists flathub https://flathub.org
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

          cat > flatpak-bin.yml <<'EOF'
          app-id: dev.llastudio.lemon-watch
          runtime: org.freedesktop.Platform
          runtime-version: '24.08'
          sdk: org.freedesktop.Sdk
          command: lemon-watch
          finish-args:
            - --share=ipc
            - --socket=x11
            - --socket=wayland
            - --device=dri
            - --filesystem=home
          modules:
            - name: lemon-watch
              buildsystem: simple
              build-commands:
                - install -Dm755 lemon-watch-linux /app/bin/lemon-watch
              sources:
                - type: file
                  path: builds/lemon-watch-linux
          EOF

          flatpak-builder --user --force-clean --repo=flatpak-repo flatpak-build flatpak-bin.yml
          flatpak build-bundle flatpak-repo "release/lemon-watch-x86_64.flatpak" dev.llastudio.lemon-watch
        shell: bash
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/*
          if-no-files-found: error

  publish-release:
    needs: [package-windows, package-macos, package-linux]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: final

      - name: Compute SHA256SUMS
        run: |
          cd final
          sha256sum * > SHA256SUMS
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final/*
          generate_release_notes: true
