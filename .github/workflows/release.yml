name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  APP_NAME: lemon-watch

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cargo_bin: lemon-watch.exe
            out_bin: lemon-watch.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            cargo_bin: lemon-watch
            out_bin: lemon-watch-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            cargo_bin: lemon-watch
            out_bin: lemon-watch-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cargo_bin: lemon-watch
            out_bin: lemon-watch-linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CFLAGS: "-Wno-error -Wno-deprecated-declarations"
        run: cargo build --release --target ${{ matrix.target }}
        timeout-minutes: 45

      - name: Prepare artifact directory
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/${{ matrix.cargo_bin }}" "out/${{ matrix.out_bin }}"
          [ "${{ matrix.os }}" != "windows-latest" ] && chmod +x "out/${{ matrix.out_bin }}" || true
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: builds-${{ matrix.os }}-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  package-windows:
    needs: [build]
    if: always() && needs.build.result != 'cancelled'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: builds-windows-latest-x86_64-pc-windows-msvc
          path: builds

      - name: Package .exe, -Setup.exe and .msi
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          if (-not $ver) { $ver = "1.0.0" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item builds\lemon-watch.exe "release\lemon-watch-$ver-win-x64.exe"
          choco install --no-progress nsis -y
          dotnet tool install --global wix --version 4.0.5
          $env:PATH += ";C:\Program Files (x86)\NSIS;$env:USERPROFILE\.dotnet\tools"
          @"
          !include "MUI2.nsh"
          Name "LemonWatch"
          OutFile "release\lemon-watch-Setup-$ver.exe"
          InstallDir "`$PROGRAMFILES64\LemonWatch"
          RequestExecutionLevel admin
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          Section "Main"
            SetOutPath "`$INSTDIR"
            File "builds\lemon-watch.exe"
            WriteUninstaller "`$INSTDIR\uninstall.exe"
          SectionEnd
          Section "Uninstall"
            Delete "`$INSTDIR\lemon-watch.exe"
            Delete "`$INSTDIR\uninstall.exe"
            RMDir "`$INSTDIR"
          SectionEnd
          "@ | Set-Content inst.nsi
          makensis inst.nsi
          @"
          <Wix xmlns="http://wixtoolset.org">
            <Package Name="LemonWatch" Manufacturer="LLAStudio" Version="$ver" UpgradeCode="8b7d1a2c-4f3e-4a9b-9c1d-2e5f6a7b8c9d">
              <MajorUpgrade DowngradeErrorMessage="Newer version already installed." />
              <MediaTemplate EmbedCab="yes" />
              <Feature Id="Main"><ComponentRef Id="Exe" /></Feature>
              <StandardDirectory Id="ProgramFiles64Folder">
                <Directory Id="INSTALLFOLDER" Name="LemonWatch">
                  <Component Id="Exe" Guid="*">
                    <File Source="builds\lemon-watch.exe" KeyPath="yes" />
                  </Component>
                </Directory>
              </StandardDirectory>
            </Package>
          </Wix>
          "@ | Set-Content product.wxs
          wix build product.wxs -o "release\lemon-watch-$ver-win-x64.msi"
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*
          
  package-macos:
    needs: [build]
    if: always() && needs.build.result != 'cancelled'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: builds-macos-latest-*
          merge-multiple: true
          path: builds

      - name: Package .app.zip and .dmg
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          [ -z "$VER" ] && VER="1.0.0"
          mkdir -p out release "release/LemonWatch.app/Contents/MacOS" "release/LemonWatch.app/Contents/Resources"
          if [ -f builds/lemon-watch-aarch64 ] && [ -f builds/lemon-watch-x86_64 ]; then
            lipo -create -output out/lemon-watch-mac builds/lemon-watch-aarch64 builds/lemon-watch-x86_64
          elif [ -f builds/lemon-watch-aarch64 ]; then
            cp builds/lemon-watch-aarch64 out/lemon-watch-mac
          elif [ -f builds/lemon-watch-x86_64 ]; then
            cp builds/lemon-watch-x86_64 out/lemon-watch-mac
          else
            echo "No macOS binary built" && exit 1
          fi
          cp out/lemon-watch-mac "release/LemonWatch.app/Contents/MacOS/LemonWatch"
          chmod +x "release/LemonWatch.app/Contents/MacOS/LemonWatch"
          [ -f assets/icon.icns ] && cp assets/icon.icns "release/LemonWatch.app/Contents/Resources/icon.icns" || true
          cat > "release/LemonWatch.app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>LemonWatch</string>
            <key>CFBundleIconFile</key><string>icon.icns</string>
            <key>CFBundleIdentifier</key><string>dev.llastudio.lemon-watch</string>
            <key>CFBundleName</key><string>LemonWatch</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          cd release
          zip -r "lemon-watch-${VER}-mac-universal.app.zip" "LemonWatch.app"
          mkdir -p dmg-root && cp -R "LemonWatch.app" dmg-root/ && ln -s /Applications dmg-root/Applications
          hdiutil create -volname "LemonWatch" -srcfolder dmg-root -ov -format UDZO "lemon-watch-${VER}-mac-universal.dmg"
          rm -rf "LemonWatch.app" dmg-root
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release/*

  package-linux:
    needs: [build]
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: builds-ubuntu-latest-x86_64-unknown-linux-gnu
          path: builds

      - name: Package .AppImage and .flatpak
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          [ -z "$VER" ] && VER="1.0.0"
          mkdir -p release AppDir/usr/bin
          cp builds/lemon-watch-linux AppDir/usr/bin/lemon-watch
          chmod +x AppDir/usr/bin/lemon-watch
          printf '[Desktop Entry]\nType=Application\nName=LemonWatch\nExec=lemon-watch\nIcon=lemon-watch\nCategories=Utility;\n' > AppDir/lemon-watch.desktop
          if [ -f assets/icon.png ]; then cp assets/icon.png AppDir/lemon-watch.png; else python3 -c "import struct,zlib; sig=b'\x89PNG\r\n\x1a\n'; chunk=lambda t,d: struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff); ihdr=struct.pack('>IIBBBBB',64,64,8,2,0,0,0); idat=zlib.compress(b'\x00'*64*193); open('AppDir/lemon-watch.png','wb').write(sig+chunk(b'IHDR',ihdr)+chunk(b'IDAT',idat)+chunk(b'IEND',b''))"; fi
          printf '#!/bin/bash\nHERE="$(dirname "$(readlink -f "${0}")")"\nexec "${HERE}/usr/bin/lemon-watch" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          wget -q https://github.com -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run AppDir "release/lemon-watch-${VER}-linux-x86_64.AppImage"

          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          printf 'app-id: dev.llastudio.lemon-watch\nruntime: org.freedesktop.Platform\nruntime-version: "24.08"\nsdk: org.freedesktop.Sdk\ncommand: lemon-watch\nfinish-args:\n  - --share=ipc\n  - --socket=x11\n  - --socket=wayland\n  - --device=dri\n  - --filesystem=home\nmodules:\n  - name: lemon-watch\n    buildsystem: simple\n    build-commands:\n      - install -Dm755 lemon-watch-linux /app/bin/lemon-watch\n    sources:\n      - type: file\n        path: builds/lemon-watch-linux\n' > flatpak-bin.yml
          mkdir -p flatpak-repo
          flatpak-builder --user --force-clean --repo=flatpak-repo flatpak-build flatpak-bin.yml
          flatpak build-bundle flatpak-repo "release/lemon-watch-${VER}-x86_64.flatpak" dev.llastudio.lemon-watch
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/*

  publish-release:
    needs: [package-windows, package-macos, package-linux]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: final

      - name: Compute SHA256SUMS and Publish
        run: |
          cd final
          sha256sum * > SHA256SUMS
        shell: bash

      - uses: softprops/action-gh-release@v2
        with:
          files: final/*
          generate_release_notes: true
