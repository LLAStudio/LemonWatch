name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: lemon-watch

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          if [ -z "$VERSION" ]; then
            echo "::error::could not read the package version from Cargo.toml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

  build:
    name: Build ${{ matrix.target }}
    needs: [prepare]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: lemon-watch.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: lemon-watch-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: lemon-watch-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: lemon-watch-linux

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        timeout-minutes: 45

      - name: Collect binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "out/${{ matrix.artifact }}"
          ls -la out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: builds-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  package-windows:
    name: Package Windows
    needs: [prepare, build]
    if: always() && needs.build.result != 'cancelled' && needs.prepare.result == 'success'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows binary
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: builds-x86_64-pc-windows-msvc
          path: builds

      - name: Install NSIS and WiX
        continue-on-error: true
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if (-not (Get-Command wix -ErrorAction SilentlyContinue)) {
            dotnet tool install --global wix --version 4.*
          }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (Test-Path "C:\Program Files (x86)\NSIS") {
            "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Package portable .exe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          VER="${VERSION}"
          mkdir -p release
          cp builds/lemon-watch.exe "release/lemon-watch-${VER}-win-x64.exe"
          ls -la release

      - name: Package .setup.exe (NSIS)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          VER="${VERSION}"
          mkdir -p release
          cat > inst.nsi <<'NSIS'
          Unicode True
          !include "MUI2.nsh"

          !define APPNAME "LemonWatch"
          !define EXENAME "lemon-watch.exe"
          !define PUBLISHER "LLAStudio"
          !define VERSION "@VERSION@"

          Name "${APPNAME}"
          OutFile "release/lemon-watch-Setup-@VERSION@.exe"
          InstallDir "$PROGRAMFILES64\${APPNAME}"
          InstallDirRegKey HKLM "Software\${APPNAME}" "InstallDir"
          RequestExecutionLevel admin
          SetCompressor /SOLID lzma

          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"

          Section "LemonWatch" SecMain
            SectionIn RO
            SetOutPath "$INSTDIR"
            File "builds/lemon-watch.exe"
            WriteUninstaller "$INSTDIR/uninstall.exe"
            CreateShortcut "$SMPROGRAMS\LemonWatch.lnk" "$INSTDIR\${EXENAME}"
            CreateShortcut "$DESKTOP\LemonWatch.lnk" "$INSTDIR\${EXENAME}"
          SectionEnd

          Section -Post
            WriteRegStr HKLM "Software\${APPNAME}" "InstallDir" "$INSTDIR"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\${APPNAME}" "DisplayName" "${APPNAME}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\${APPNAME}" "DisplayVersion" "${VERSION}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\${APPNAME}" "Publisher" "${PUBLISHER}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\${APPNAME}" "DisplayIcon" "$INSTDIR\${EXENAME}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\${APPNAME}" "UninstallString" "$INSTDIR\uninstall.exe"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\${APPNAME}" "URLInfoAbout" "https://github.com/LLAStudio/LemonWatch"
            WriteRegDWORD HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\${APPNAME}" "NoModify" 1
            WriteRegDWORD HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\${APPNAME}" "NoRepair" 1
          SectionEnd

          Section "Uninstall"
            Delete "$INSTDIR\${EXENAME}"
            Delete "$INSTDIR\uninstall.exe"
            Delete "$SMPROGRAMS\LemonWatch.lnk"
            Delete "$DESKTOP\LemonWatch.lnk"
            RMDir "$INSTDIR"
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\${APPNAME}"
            DeleteRegKey HKLM "Software\${APPNAME}"
          SectionEnd
          NSIS
          sed -i "s/@VERSION@/${VER}/g" inst.nsi
          makensis -V3 inst.nsi
          ls -la release

      - name: Package .msi (WiX v4)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          VER="${VERSION}"
          mkdir -p release
          cat > product.wxs <<'WXS'
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">
            <Package Name="LemonWatch"
                     Manufacturer="LLAStudio"
                     Version="@VERSION@"
                     UpgradeCode="7C4B9E2D-3A18-4C6F-9D51-2E7A8B6C1F03"
                     Language="1033"
                     Scope="perMachine"
                     InstallerVersion="500"
                     Compressed="yes">
              <MajorUpgrade DowngradeErrorMessage="A newer version of LemonWatch is already installed." />
              <MediaTemplate EmbedCab="yes" />
              <StandardDirectory Id="ProgramFiles64Folder">
                <Directory Id="INSTALLFOLDER" Name="LemonWatch">
                  <Component Id="MainExecutable" Guid="*">
                    <File Id="LemonWatchExe" Source="builds/lemon-watch.exe" KeyPath="yes" />
                  </Component>
                </Directory>
              </StandardDirectory>
              <Feature Id="Main" Title="LemonWatch" Level="1">
                <ComponentRef Id="MainExecutable" />
              </Feature>
            </Package>
          </Wix>
          WXS
          sed -i "s/@VERSION@/${VER}/g" product.wxs
          wix build -arch x64 product.wxs -out "release/lemon-watch-${VER}-win-x64.msi"
          ls -la release

      - name: List packaged files
        if: always()
        shell: bash
        run: ls -la release || true

      - name: Upload Windows packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*
          if-no-files-found: warn
          retention-days: 7

  package-macos:
    name: Package macOS
    needs: [prepare, build]
    if: always() && needs.build.result != 'cancelled' && needs.prepare.result == 'success'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Download macOS binaries
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: builds-*-apple-darwin
          merge-multiple: true
          path: builds

      - name: Prepare app icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p meta
          if [ -f assets/icon.png ] && [ "$(head -c 8 assets/icon.png | tail -c 4)" = "PNG" ]; then
            cp assets/icon.png meta/icon.png
          else
            python3 -c "import struct,zlib; w=h=512; raw=(b'\x00'+bytes([255,224,102])*w)*h; c=lambda k,d: struct.pack('>I',len(d))+k+d+struct.pack('>I',zlib.crc32(k+d)&0xffffffff); open('meta/icon.png','wb').write(b'\x89PNG\r\n\x1a\n'+c(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+c(b'IDAT',zlib.compress(raw,9))+c(b'IEND',b''))"
          fi

      - name: Build universal binary, .app, .zip and .dmg
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          VER="${VERSION}"
          mkdir -p out release
          ls -la builds || true

          if [ -f builds/lemon-watch-aarch64 ] && [ -f builds/lemon-watch-x86_64 ]; then
            lipo -create -output out/lemon-watch builds/lemon-watch-aarch64 builds/lemon-watch-x86_64
          elif [ -f builds/lemon-watch-aarch64 ]; then
            cp builds/lemon-watch-aarch64 out/lemon-watch
          elif [ -f builds/lemon-watch-x86_64 ]; then
            cp builds/lemon-watch-x86_64 out/lemon-watch
          else
            echo "::error::no macOS binaries were produced"
            exit 1
          fi
          chmod +x out/lemon-watch
          lipo -info out/lemon-watch || true

          APP="release/LemonWatch.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp out/lemon-watch "$APP/Contents/MacOS/LemonWatch"
          chmod +x "$APP/Contents/MacOS/LemonWatch"

          if [ -f assets/icon.icns ]; then
            cp assets/icon.icns "$APP/Contents/Resources/icon.icns"
          elif [ -f meta/icon.png ]; then
            rm -rf /tmp/lemonwatch.iconset
            mkdir -p /tmp/lemonwatch.iconset
            for size in 16 32 128 256 512; do
              sips -z "$size" "$size" meta/icon.png --out "/tmp/lemonwatch.iconset/icon_${size}x${size}.png" >/dev/null 2>&1 || true
              sips -z "$((size * 2))" "$((size * 2))" meta/icon.png --out "/tmp/lemonwatch.iconset/icon_${size}x${size}@2x.png" >/dev/null 2>&1 || true
            done
            iconutil -c icns /tmp/lemonwatch.iconset -o "$APP/Contents/Resources/icon.icns" 2>/dev/null || true
          fi

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>LemonWatch</string>
            <key>CFBundleIconFile</key><string>icon.icns</string>
            <key>CFBundleIdentifier</key><string>dev.llastudio.lemon-watch</string>
            <key>CFBundleName</key><string>LemonWatch</string>
            <key>CFBundleDisplayName</key><string>LemonWatch</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          ditto -c -k --sequesterRsrc --keepParent "$APP" "release/lemon-watch-${VER}-mac-universal.app.zip"
          hdiutil create -volname "LemonWatch" -srcfolder "$APP" -ov -format UDZO \
            "release/lemon-watch-${VER}-mac-universal.dmg"
          ls -la release

      - name: List packaged files
        if: always()
        shell: bash
        run: ls -la release || true

      - name: Upload macOS packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release/*
          if-no-files-found: warn
          retention-days: 7

  package-linux:
    name: Package Linux
    needs: [prepare, build]
    if: always() && needs.build.result != 'cancelled' && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binary
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: builds-x86_64-unknown-linux-gnu
          path: builds

      - name: Install packaging tools
        continue-on-error: true
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare app icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p meta
          if [ -f assets/icon.png ] && [ "$(head -c 8 assets/icon.png | tail -c 4)" = "PNG" ]; then
            cp assets/icon.png meta/icon.png
          else
            python3 -c "import struct,zlib; w=h=512; raw=(b'\x00'+bytes([255,224,102])*w)*h; c=lambda k,d: struct.pack('>I',len(d))+k+d+struct.pack('>I',zlib.crc32(k+d)&0xffffffff); open('meta/icon.png','wb').write(b'\x89PNG\r\n\x1a\n'+c(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+c(b'IDAT',zlib.compress(raw,9))+c(b'IEND',b''))"
          fi

      - name: Package AppImage
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          VER="${VERSION}"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p release
          APPDIR="$PWD/AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/512x512/apps"
          cp builds/lemon-watch-linux "$APPDIR/usr/bin/lemon-watch"
          chmod +x "$APPDIR/usr/bin/lemon-watch"

          cat > "$APPDIR/AppRun" <<'RUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/lemon-watch" "$@"
          RUN
          chmod +x "$APPDIR/AppRun"

          cp lemon-watch.desktop "$APPDIR/lemon-watch.desktop"
          cp lemon-watch.desktop "$APPDIR/usr/share/applications/lemon-watch.desktop"
          if [ -f meta/icon.png ]; then
            cp meta/icon.png "$APPDIR/lemon-watch.png"
            cp meta/icon.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/lemon-watch.png"
          fi

          appimagetool --appimage-extract-and-run --no-appstream "$APPDIR" \
            "release/lemon-watch-${VER}-linux-x86_64.AppImage"
          ls -la release

      - name: Package Flatpak
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          VER="${VERSION}"
          mkdir -p release flatpak-build
          cp builds/lemon-watch-linux flatpak-build/lemon-watch
          chmod +x flatpak-build/lemon-watch
          cp lemon-watch.desktop flatpak-build/dev.llastudio.lemon-watch.desktop
          cp meta/icon.png flatpak-build/icon.png
          cp dev.llastudio.lemon-watch.yml flatpak-build/

          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          cd flatpak-build
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=repo --install-deps-from=flathub build-dir dev.llastudio.lemon-watch.yml
          flatpak build-bundle repo "../release/lemon-watch-${VER}-x86_64.flatpak" dev.llastudio.lemon-watch
          ls -la ../release

      - name: List packaged files
        if: always()
        shell: bash
        run: ls -la release || true

      - name: Upload Linux packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/*
          if-no-files-found: warn
          retention-days: 7

  publish-release:
    name: Publish Release
    needs: [prepare, package-windows, package-macos, package-linux]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: final

      - name: Verify artifacts and compute checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(final/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no release artifacts were downloaded"
            exit 1
          fi
          echo "Artifacts to publish:"
          ls -la final
          (cd final && sha256sum * > SHA256SUMS)
          echo "SHA256SUMS:"
          cat final/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: LemonWatch ${{ needs.prepare.outputs.tag }}
          files: final/*
          generate_release_notes: true
          fail_on_unmatched_files: false
