name: CI

on:
  pull_request:
  # Lets a maintainer regenerate the README screenshot on demand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build
        run: cargo build --target ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        timeout-minutes: 45

  lint-and-test:
    name: Clippy and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-lint

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # Every clippy and rustc warning fails the job; the crate is clean today,
      # so this keeps it from drifting back into a warning backlog.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  # Source of the image in the README: builds the real binary, runs it on a
  # software X display and screenshots the window. The artifact is the file to
  # commit as assets/screenshot.png.
  screenshot:
    name: Screenshot (Xvfb)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-screenshot

      - name: Install build and capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            xvfb xdotool imagemagick libgl1-mesa-dri libxkbcommon-x11-0

      - name: Build
        run: cargo build

      # Sparse files give the window believable GB-scale caches without using
      # disk, and the ages cover every inactivity badge including dormant ones.
      - name: Create a demo workspace
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/lemon-workspace"
          rm -rf "$W" && mkdir -p "$W"
          project() {
            name=$1; marker=$2; age=$3; shift 3
            mkdir -p "$W/$name/src"
            printf '{"name":"%s"}\n' "$name" > "$W/$name/$marker"
            printf 'export const app = 1;\n' > "$W/$name/src/index.js"
            for cache in "$@"; do
              mkdir -p "$W/$name/${cache%%:*}"
              truncate -s "${cache##*:}" "$W/$name/${cache%%:*}/blob.bin"
            done
            find "$W/$name" -exec touch -d "$age days ago" {} +
          }
          project acme-storefront package.json 2 node_modules:1717986918 .next:440401920
          project design-system package.json 3 node_modules:1288490188
          project ml-pipeline pyproject.toml 6 .venv:1181116006 __pycache__:18874368
          project acme-api package.json 12 node_modules:933232640
          project infra go.mod 30 vendor:356515840
          project payments-core Cargo.toml 45 target:2469606195
          project cli-tool Cargo.toml 120 target:440401920
          project legacy-crawler pyproject.toml 210 .venv:650117120
          project docs-site package.json 400 .next:99614720
          project scratch-notes .git 3
          echo "LEMON_WORKSPACE=$W" >> "$GITHUB_ENV"

      - name: Capture the window
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum \
            --server-args="-screen 0 1280x800x24 +extension GLX +extension XTEST +render -noreset" \
            bash -c '
              set -euo pipefail
              ./target/debug/lemon-watch "$LEMON_WORKSPACE" &
              app=$!
              win=$(timeout 60 xdotool search --sync --name LemonWatch | head -1)
              sleep 8  # let the background scan finish so the list is populated
              import -window "$win" assets/screenshot.png
              # Drive the UI with real X input. Coordinates assume the default
              # 1100x720 window: "Select Dormant (>30d)" then "Purge Selected"
              # in the toolbar row.
              xdotool windowfocus "$win"
              xdotool mousemove --window "$win" 75 172 click 1
              sleep 2
              xdotool mousemove --window "$win" 1000 172 click 1
              sleep 2
              import -window "$win" assets/screenshot-purge.png
              kill "$app" || true
            '
          # A blank capture still succeeds, so fail if either image is almost flat.
          for shot in assets/screenshot.png assets/screenshot-purge.png; do
            file "$shot"
            colours=$(identify -format '%k' "$shot")
            echo "$shot unique colours: $colours"
            test "$colours" -gt 50
          done
          # A missed click leaves the second capture showing the list, so require
          # a dialog-sized change: the overlay repaints ~35k pixels, while the
          # selection state alone changes ~5k.
          changed=$(convert assets/screenshot.png assets/screenshot-purge.png \
            -compose difference -composite -colorspace Gray -threshold 10% \
            -format "%[fx:mean*w*h]" info:)
          echo "changed pixels: $changed"
          awk -v n="$changed" 'BEGIN { exit !(n > 12000) }'

      - uses: actions/upload-artifact@v4
        with:
          name: lemon-watch-screenshots
          path: |
            assets/screenshot.png
            assets/screenshot-purge.png
          if-no-files-found: error
          retention-days: 14

