[package]
name = "lemon-watch"
version = "1.0.6"
edition = "2021"
authors = ["LLAStudio"]
description = "🍋 LemonWatch — Instant workspace cache scanner & purger. Zero-config micro-utility with a native egui desktop GUI."
license = "MIT"
repository = "https://github.com/LLAStudio/LemonWatch"

[dependencies]
eframe = "0.30"
egui = "0.30"
rfd = "0.15"
walkdir = "2.5"
rayon = "1.10"
open = "5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "lemon-watch"
path = "src/main.rs"
